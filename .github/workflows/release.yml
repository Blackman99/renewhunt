name: Release
on:
  push: {tags: ['v*']}
permissions: {contents: write}
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: release --clean}
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Update Homebrew formula in Blackman99/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_KEY" ]; then echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set; skipping tap update"; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Blackman99/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/brew-formula.sh "$TAG" dist/checksums.txt > tap/Formula/renewhunt.rb
          ruby -c tap/Formula/renewhunt.rb
          cd tap
          git config user.name "renewhunt-release[bot]"
          git config user.email "renewhunt-release@users.noreply.github.com"
          git add Formula/renewhunt.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "renewhunt ${TAG#v}"
          git push origin HEAD:main
          rm -f ~/.ssh/tap_key
