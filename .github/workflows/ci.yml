name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: go build -o renewhunt ./cmd/renewhunt
      - run: ./test/e2e.sh
